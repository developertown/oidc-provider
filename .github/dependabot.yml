version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - javascript
    # oidc-provider is a published library, so leave the declared caret ranges
    # alone whenever the new version already satisfies them - bumping them would
    # narrow what consumers are allowed to resolve. Most updates land as
    # lockfile-only changes, which is all CI needs.
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: chore
      include: scope
    # Doesn't apply to security updates - those still go out immediately.
    cooldown:
      default-days: 5
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 14
    groups:
      # Split dev from production: production bumps ship to consumers of
      # @developertown/oidc-provider and deserve their own review, dev bumps
      # (eslint, vitest, bunchee, ...) are just tooling. Major bumps are excluded
      # from both groups so they always get their own PR.
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: chore
      include: scope
    # Action tags aren't reliably semver, so only default-days is supported here
    # (no semver-*-days tiers) - unlike npm.
    cooldown:
      default-days: 5
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
